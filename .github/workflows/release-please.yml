# Release automation.
#
# release-please watches `main` for Conventional Commits and keeps ONE pull
# request open that accumulates the next release: it writes CHANGELOG.md, bumps
# the version in .release-please-manifest.json and frontend/package.json, and
# when you merge that PR it tags the commit and cuts a GitHub Release.
#
# Nothing here publishes a package or deploys anything. It only writes a
# changelog, a version and a tag -- deployment stays a human action, which
# matters for this repo because CLAUDE.md records that JVM, font and native
# library checks can pass locally and fail silently inside the slim Debian
# image. A green tag is not a proven deploy.
#
# The commit style is already in place: this repository's history is
# Conventional Commits throughout (feat/fix/test/refactor/docs), so the first
# run has real material to work from rather than starting empty.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # create the release branch, the tag and the Release
  pull-requests: write   # open and update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Still on node20 upstream as of 2026-09-11, so this one action keeps
      # raising GitHub's node20 deprecation notice. That is upstream's to fix
      # -- v4 is the current major -- and it is a warning, not a failure.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT is REQUIRED here, not a preference. The built-in token
          # cannot open a pull request: this repo reports
          # `can_approve_pull_request_reviews=false`, and the first run failed
          # with "GitHub Actions is not permitted to create or approve pull
          # requests". release-please got as far as creating the branch and
          # the commit, then could not open the PR.
          #
          # The secret cannot be called anything starting with `GITHUB_` --
          # GitHub reserves that prefix and refuses to create such a secret.
          # Hence RELEASE_PLEASE_TOKEN. It needs `contents: write` and
          # `pull-requests: write` on this repo and nothing else; a
          # fine-grained PAT scoped to this repository alone is enough.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
