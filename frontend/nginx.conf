server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Orthonym's FastAPI routes are defined at /api/... in the app itself
    # (not mounted at root), so the prefix is preserved, not stripped.
    location /api/ {
        # Counterpart of the backend's MAX_FILE_SIZE_MB (see .env.example
        # and backend/config/*.yml). nginx's default of 1m is far below what
        # the app advertises, and nginx must never be the one to reject a
        # file the app would accept -- that would surface as a stock nginx
        # HTML 413 instead of the app's honest JSON error. MAX_FILE_SIZE_MB
        # is profile-driven (small.yml: 20, medium.yml: 50, large.yml: 200)
        # but this file is static, so this is sized to the largest profile
        # actually deployed (200) plus headroom for multipart boundary/part
        # header overhead, not to whichever profile is active today. Raise
        # this if a profile is ever introduced above 200.
        client_max_body_size 210m;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
