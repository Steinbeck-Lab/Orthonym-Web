# This server is NOT the edge on a public deployment. It listens on plain
# HTTP and expects a TLS terminator (nginx, Caddy, Traefik) in front of it
# holding the certificate for the real hostname. Two consequences are
# encoded below: real_ip, and the absence of HSTS.

# Without this block, every visitor shares one rate-limit bucket the moment
# a TLS terminator is put in front. The chain is: client -> terminator ->
# this server -> backend. `proxy_set_header X-Real-IP $remote_addr` below is
# what app/ratelimit.py counts by, and $remote_addr here is the TERMINATOR's
# address, identical for every request on the internet. That is the exact
# failure docker-compose.yml's port-binding comment describes for
# TRUST_PROXY_HEADERS=false -- 2 concurrent jobs and 60 requests/min for all
# visitors combined -- reintroduced one hop further out.
#
# real_ip rewrites $remote_addr from X-Forwarded-For, but ONLY when the peer
# is inside a range listed here, so a direct caller from the public internet
# cannot forge its own address. The private ranges are the safe default
# because they are exactly where a co-located or containerised terminator
# lives. Narrow this to the terminator's single address if it has a fixed
# one; do NOT widen it to 0.0.0.0/0, which makes every per-IP cap void.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No HSTS here: this server never speaks TLS, and a Strict-Transport-
    # Security header sent over plain HTTP is ignored by browsers. It belongs
    # on the TLS terminator, which is the only hop that can honestly assert
    # it. `always` on the rest so they survive error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A HOOK, inert by default: the glob matches nothing unless something is
    # mounted at /etc/nginx/snippets/, and nginx accepts an include whose
    # pattern matches no files. It exists so a deployment can add server-wide
    # directives -- a Basic Auth gate while a site is in preview, an IP
    # allowlist -- WITHOUT forking this file or baking credentials into the
    # image. Anything dropped in here is inherited by every location below,
    # `/api/` and `/assets/` included, which is what a gate has to cover.
    #
    # See INSTALL.md, "Putting the site behind a password", for the snippet
    # and the one trap: the container's own healthcheck requests
    # http://127.0.0.1/ and a bare `auth_basic` would 401 it, marking the
    # container unhealthy. `satisfy any` with `allow 127.0.0.1` is what keeps
    # the healthcheck passing while everyone else is prompted.
    include /etc/nginx/snippets/*.conf;

    # text/html is gzipped by default and must not be listed again. SVG is
    # here because the depiction payloads and the whole icon set are SVG.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # `no-cache` means "revalidate before reuse", NOT "do not store" -- the
    # ETag above still turns a repeat visit into a 304 with no body, so this
    # costs one conditional request and not a re-download.
    #
    # It is load-bearing, and MEASURED rather than assumed. index.html
    # shipped with no Cache-Control at all for one iteration, on the belief
    # that no header meant no caching. It does not: with only Last-Modified
    # and an ETag, browsers apply HEURISTIC caching, commonly a tenth of the
    # document's age. index.html is the document that names the current
    # hashed bundle, so a stale copy points at an /assets/ file the new
    # deploy deleted -- and because those assets are immutable-cached for a
    # year, the failure is a blank page with nothing in the console. Caught
    # by curling the headers after a redeploy served an old bundle.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite fingerprints every file under /assets/, so the content of a given
    # URL can never change and a year is safe. index.html is the opposite
    # case and takes an explicit `no-cache` in the location above -- it is
    # the document that names the current hashes, so a cached copy pins a
    # visitor to a deployed-then-deleted bundle.
    #
    # `expires` and nothing else, deliberately. An `add_header` anywhere in
    # this block would replace the server-level set entirely rather than add
    # to it, silently stripping the three security headers above from every
    # asset. `expires` sets Cache-Control by its own mechanism and leaves
    # inheritance alone.
    location /assets/ {
        expires 1y;
    }

    # STITCH's FastAPI routes are defined at /api/... in the app itself
    # (not mounted at root), so the prefix is preserved, not stripped.
    location /api/ {
        # Counterpart of the backend's MAX_FILE_SIZE_MB (see .env.example
        # and backend/config/*.yml). nginx's default of 1m is far below what
        # the app advertises, and nginx must never be the one to reject a
        # file the app would accept -- that would surface as a stock nginx
        # HTML 413 instead of the app's honest JSON error. MAX_FILE_SIZE_MB
        # is profile-driven (small.yml: 20, medium.yml: 50, large.yml: 200)
        # but this file is static, so this is sized to the largest profile
        # actually deployed (200) plus headroom for multipart boundary/part
        # header overhead, not to whichever profile is active today. Raise
        # this if a profile is ever introduced above 200.
        client_max_body_size 210m;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must stay comfortably above the backend's FAST_PATH_TIMEOUT (30 s
        # by default, app/core/config.py). nginx's stock proxy_read_timeout
        # is 60 s: raise FAST_PATH_TIMEOUT past that and nginx gives up
        # first, so the caller gets nginx's stock 504 HTML instead of the
        # app's honest JSON job envelope -- and the request that WAS about to
        # succeed is discarded. 120 leaves room to raise the app's own
        # timeout without this becoming the binding one by accident.
        proxy_read_timeout 120s;
    }
}
