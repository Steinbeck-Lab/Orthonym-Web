  <body>
    <!--
THESIS: The name is the instrument reading, so it gets the whole machined panel — refusing both the SaaS dashboard card-deck and the warm-paper citation world this replaces.
OWN-WORLD: Inverted Bugatti. Pure white canvas (#ffffff), black type (#000000), zero accent; three faces held apart absolutely — Saira Condensed uppercase wide-tracked display, Public Sans body, JetBrains Mono uppercase captions/buttons/nav. Weight 400 only, no bold anywhere. Radius 0 on every surface; the pill belongs to buttons alone. Depth is hairline seam, never shadow. Full-bleed edge-to-edge bento mosaic, cells welded by 1px seams.
STORY: A visitor submits a structure and reads its true confidence off a rule beneath the name — double (PIN), dashed (fallback), dotted (best-effort), blank slot (abstain), struck (error). Never a color, at any width.
FIRST VIEWPORT: A 56px wordmark bar, the route index below it, then one edge-to-edge bento mosaic: an oversized input cell left, the empty result panel right, spec-cells for the measured accuracy beneath. Primary action is a transparent black-outlined pill inside the input cell.
FORM: Bugatti design analysis (getdesign.md/bugatti), user-pinned; light-inverted, widened and bento-gridded by explicit instruction. Seed key: none — the concept roll was preempted, because the brief named the world by URL rather than leaving it open.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
-->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
