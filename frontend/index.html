    <!-- Tells Google the site's name is "Orthonym" (WebSite) and what it is
         (WebApplication). Every claim here is one the site itself makes. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://orthonym.decimer.ai/#website",
            "name": "Orthonym",
            "url": "https://orthonym.decimer.ai/"
          },
          {
            "@type": "WebApplication",
            "name": "Orthonym",
            "alternateName": "Orthonym IUPAC name generator",
            "url": "https://orthonym.decimer.ai/",
            "description": "Free IUPAC name generator: a deterministic, rule-based SMILES to IUPAC name translator. OPSIN reads every name back, and each result is labelled with the confidence tier it earned.",
            "applicationCategory": "Chemistry",
            "operatingSystem": "Any (web browser)",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "isPartOf": { "@id": "https://orthonym.decimer.ai/#website" },
            "creator": [
              { "@type": "Organization", "name": "Steinbeck Lab, Friedrich Schiller University Jena", "url": "https://cheminf.uni-jena.de" },
              { "@type": "Organization", "name": "Beilstein-Institut", "url": "https://www.beilstein-institut.de/en/" }
            ],
            "sameAs": [
              "https://github.com/Steinbeck-Lab/Orthonym",
              "https://github.com/Steinbeck-Lab/Orthonym-Web"
            ],
            "citation": "https://doi.org/10.26434/chemrxiv.15009769/v1"
          }
        ]
      }
    </script>
    <script>
      // The first-load assembly (pages/Home.css, "first load"). Set here, before
      // the first paint, so the page never flashes whole and then hides. Only on
      // a fresh arrival at Home: a reload, back/forward or an in-app link does
      // not replay it. The browser's own navigation type decides that, so
      // nothing is stored (Privacy.jsx: no session storage). Home removes the
      // class once the sequence has played.
      try {
        var nav = performance.getEntriesByType('navigation')[0]
        // '/' is Home's route in App.jsx; change the two together.
        if (location.pathname === '/' && (!nav || nav.type === 'navigate')) {
          document.documentElement.classList.add('first-load')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
THESIS: The name is the instrument reading, so it gets the whole machined panel — refusing both the SaaS dashboard card-deck and the warm-paper citation world this replaces.
OWN-WORLD: Inverted Bugatti. Pure white canvas (#ffffff), black type (#000000), zero accent; three faces held apart absolutely — Saira Condensed uppercase wide-tracked display, Public Sans body, JetBrains Mono uppercase captions/buttons/nav. Weight 400 only, no bold anywhere. Radius 0 on every surface; the pill belongs to buttons alone. Depth is hairline seam, never shadow. Full-bleed edge-to-edge bento mosaic, cells welded by 1px seams.
STORY: A visitor submits a structure and reads its true confidence off a rule beneath the name — double (PIN), dashed (fallback), dotted (best-effort), blank slot (abstain), struck (error). Never a color, at any width.
FIRST VIEWPORT: A 56px wordmark bar, the route index below it, then one edge-to-edge bento mosaic: an oversized input cell left, the empty result panel right, spec-cells for the measured accuracy beneath. Primary action is a transparent black-outlined pill inside the input cell.
FORM: Bugatti design analysis (getdesign.md/bugatti), user-pinned; light-inverted, widened and bento-gridded by explicit instruction. Seed key: none — the concept roll was preempted, because the brief named the world by URL rather than leaving it open.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
-->
    <div id="root"></div>
    <!-- What a crawler or a browser without JavaScript reads: the same words
         the site says, and its routes as plain links. -->
    <noscript>
      <h1>Orthonym — free IUPAC name generator</h1>
      <p>
        Orthonym is a free IUPAC naming tool: a deterministic, rule-based SMILES to IUPAC name translator. Paste SMILES,
        upload a file or draw a molecule, and each name comes back read by OPSIN and labelled
        with the confidence it earned, or the engine says it could not name it. Orthonym needs
        JavaScript to run.
      </p>
      <ul>
        <li><a href="/">Translate SMILES to IUPAC names</a></li>
        <li><a href="/from-name">IUPAC name to structure</a></li>
        <li><a href="/explain">Explain an IUPAC name</a></li>
        <li><a href="/about">About Orthonym</a></li>
        <li><a href="https://github.com/Steinbeck-Lab/Orthonym">The Orthonym engine on GitHub</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
